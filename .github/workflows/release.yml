name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in module.json
        run: |
          jq --arg ver "${{ steps.version.outputs.VERSION }}" '.version = $ver' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Create zip
        run: |
          zip -r token-action-hud-l5r5e.zip \
            module.json \
            scripts/init.js \
            scripts/constants.js \
            scripts/defaults.js \
            scripts/system-manager.js \
            scripts/action-handler.js \
            scripts/roll-handler.js \
            scripts/settings.js \
            scripts/utils.js \
            styles/ \
            languages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          files: |
            token-action-hud-l5r5e.zip
            module.json
